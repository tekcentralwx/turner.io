<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Blasters · turner.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1f;--panel:#151b36;--line:#2a356a;--ink:#eaf0ff;--muted:#9aa4d0;--blue:#3ec6ff;--orange:#ff8a3d;--lime:#b6ff3b;--pink:#ff4fa3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0f1530;border-bottom:2px solid #1f2850}
header a{color:var(--ink);text-decoration:none;font-weight:800}
.back{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#1a2247;border:1px solid var(--line)}
.back:hover{background:#222c5c}
.logo{font-family:Bungee;font-size:20px;letter-spacing:.5px}.logo span{color:var(--lime)}
.gname{font-family:Bungee;font-size:15px;color:var(--blue)}
#wrap{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;border-radius:12px;box-shadow:0 0 0 3px #1f2850,0 20px 60px rgba(0,0,0,.5);cursor:none;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,11,25,.84);border-radius:12px;padding:12px;overflow:auto}
.overlay.hidden{display:none}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:26px 30px;max-width:540px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.card h1{font-family:Bungee;margin:0 0 6px;font-size:clamp(26px,4.6vw,42px);line-height:1.05;color:var(--blue);text-shadow:0 0 18px rgba(62,198,255,.45)}
.card h1.win{color:var(--lime);text-shadow:0 0 18px rgba(182,255,59,.45)}
.card h1.lose{color:var(--orange);text-shadow:0 0 18px rgba(255,138,61,.45)}
.sub{color:var(--muted);margin:0 0 18px;font-size:16px;line-height:1.45}
.label{font-weight:900;font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:6px 0 8px}
.diff{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.diff button{font:800 15px Nunito;color:var(--ink);background:#1b2350;border:2px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer;min-width:96px}
.diff button small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.diff button.on{border-color:var(--lime);background:#22305a;box-shadow:0 0 0 3px rgba(182,255,59,.18)}
.btn{font:400 20px Bungee;letter-spacing:1px;color:#0b0f1f;background:var(--lime);border:none;border-radius:14px;padding:13px 34px;cursor:pointer;box-shadow:0 5px 0 #6d9a1f;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6d9a1f}
.btn.alt{background:#2a356a;color:var(--ink);box-shadow:0 5px 0 #18204a;font-size:15px;padding:11px 22px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.controls{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:14px;color:var(--muted);max-width:380px;margin-left:auto;margin-right:auto}
.controls b{color:var(--ink);white-space:nowrap}
kbd{font:800 12px Nunito;background:#0b0f1f;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:#0f1530;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:Bungee;font-size:24px;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.best{margin-top:14px;font-size:13px;color:var(--muted)}
.best b{color:var(--lime)}
.newbest{color:var(--lime);font-weight:900;margin:-8px 0 12px}
</style>
</head>
<body>
<header>
  <a class="back" href="https://tekcentralwx.github.io/turner.io/">← All games</a>
  <span class="gname">Arena Blasters</span>
  <a class="logo" href="https://tekcentralwx.github.io/turner.io/">turner<span>.io</span></a>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay" class="overlay"></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- World ----------
const TILE = 40, COLS = 30, ROWS = 20, W = COLS * TILE, H = ROWS * TILE;
const MAP = [
"##############################",
"#P.....#..........#..........#",
"#......#..........#..........#",
"#..##..#...####...#..##..cc..#",
"#..##......#..#......##..cc..#",
"#..........#..#..............#",
"####..cc...........cc...######",
"#.........#####..............#",
"#..c......#...#.......####...#",
"#..c..........#.......#......#",
"#.....###.....#..##...#..c...#",
"#.......#.........##.....c...#",
"#..cc...#..####..........#####",
"#..cc......#..........#......#",
"#..........#..cc......#..##..#",
"######..........cc.......##..#",
"#P......##..........###......#",
"#..##...##....###.........cc.#",
"#..##.........###.........cc.#",
"##############################"];

const grid = [], playerSpawns = [];
for (let r = 0; r < ROWS; r++) {
  grid.push([]);
  for (let c = 0; c < COLS; c++) {
    const ch = (MAP[r] || '')[c] || '#';
    grid[r].push(ch === '#' ? 1 : ch === 'c' ? 2 : 0);
    if (ch === 'P') playerSpawns.push({ c, r });
  }
}
const solid = (c, r) => c < 0 || r < 0 || c >= COLS || r >= ROWS || grid[r][c] > 0;
const solidAt = (x, y) => solid(Math.floor(x / TILE), Math.floor(y / TILE));
const center = (c, r) => ({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 });

function collides(x, y, rad) {
  const c0 = Math.floor((x - rad) / TILE), c1 = Math.floor((x + rad) / TILE);
  const r0 = Math.floor((y - rad) / TILE), r1 = Math.floor((y + rad) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (!solid(c, r)) continue;
    const nx = Math.max(c * TILE, Math.min(x, c * TILE + TILE));
    const ny = Math.max(r * TILE, Math.min(y, r * TILE + TILE));
    if ((x - nx) ** 2 + (y - ny) ** 2 < rad * rad) return true;
  }
  return false;
}
function moveEntity(e, dx, dy) {
  let moved = false;
  if (dx && !collides(e.x + dx, e.y, e.r)) { e.x += dx; moved = true; }
  if (dy && !collides(e.x, e.y + dy, e.r)) { e.y += dy; moved = true; }
  return moved;
}
function los(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1), steps = Math.ceil(d / 8);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
  }
  return true;
}
function losWide(a, b, w) {
  const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const px = -(b.y - a.y) / d * w, py = (b.x - a.x) / d * w;
  return los(a.x + px, a.y + py, b.x + px, b.y + py) && los(a.x - px, a.y - py, b.x - px, b.y - py);
}
function findPath(sx, sy, tx, ty) {
  const sc = Math.floor(sx / TILE), sr = Math.floor(sy / TILE);
  const tc = Math.floor(tx / TILE), tr = Math.floor(ty / TILE);
  if (solid(tc, tr) || solid(sc, sr)) return [];
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  const start = sr * COLS + sc, goal = tr * COLS + tc;
  const q = [start]; prev[start] = start;
  for (let h = 0; h < q.length; h++) {
    const cur = q[h]; if (cur === goal) break;
    const c = cur % COLS, r = (cur / COLS) | 0;
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c + dc, nr = r + dr;
      if (solid(nc, nr)) continue;
      const ni = nr * COLS + nc;
      if (prev[ni] !== -1) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  if (prev[goal] === -1) return [];
  const path = [];
  for (let i = goal; i !== start; i = prev[i]) path.push(center(i % COLS, (i / COLS) | 0));
  return path.reverse();
}
// Reachable floor tiles (from player spawn)
const reachable = [];
(() => {
  const seen = new Set(), s = playerSpawns[0], q = [[s.c, s.r]];
  seen.add(s.r * COLS + s.c);
  for (let h = 0; h < q.length; h++) {
    const [c, r] = q[h]; reachable.push({ c, r });
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c + dc, nr = r + dr, k = nr * COLS + nc;
      if (!solid(nc, nr) && !seen.has(k)) { seen.add(k); q.push([nc, nr]); }
    }
  }
})();

// ---------- Settings ----------
const DIFF = {
  easy:   { bots: 3, react: .8,  spread: .22, speed: 112, fireRate: .6,  dmg: 12, hp: 80,  turn: 5,  label: 'Easy',   note: '3 sleepy bots' },
  normal: { bots: 4, react: .48, spread: .13, speed: 135, fireRate: .42, dmg: 17, hp: 100, turn: 7,  label: 'Normal', note: '4 bots' },
  hard:   { bots: 5, react: .28, spread: .07, speed: 155, fireRate: .3,  dmg: 22, hp: 100, turn: 10, label: 'Hard',   note: '5 sharp bots' }
};
const P_SPEED = 205, P_FIRE = .14, P_DMG = 34, CLIP = 15, RELOAD = 1.3, ROUND_TIME = 90, WIN_ROUNDS = 5;
const BOT_INFO = [
  { name: 'Zappy',  col: '#ff8a3d', dark: '#9c4610' },
  { name: 'Glitch', col: '#ff4fa3', dark: '#9a1f5c' },
  { name: 'Bolt',   col: '#ffd23d', dark: '#9b7a0d' },
  { name: 'Sparky', col: '#c77dff', dark: '#6b2fa3' },
  { name: 'Byte',   col: '#ff5e5e', dark: '#9b2525' }
];
const BEST_KEY = 'turnerio.arena.best';
const loadBest = () => { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; } };
const saveBest = b => { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) {} };

// ---------- State ----------
const S = { mode: 'menu', diff: 'normal', round: 0, pWins: 0, bWins: 0, timer: ROUND_TIME, stateT: 0, msg: '', msgCol: '#fff',
  tags: 0, shots: 0, hits: 0, goT: 0, shake: 0, prevMode: 'playing' };
let player = null, bots = [], bullets = [], particles = [], texts = [], feed = [];
const keys = {}, mouse = { x: W / 2, y: H / 2, down: false, inside: false };
let usingTouch = false;
const touch = { move: null, aim: null };

// ---------- Audio ----------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function beep(f1, f2, dur, type = 'square', vol = .05, delay = 0) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 30), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sfx = {
  pShot: () => beep(1200, 300, .09, 'square', .035),
  bShot: () => beep(700, 200, .1, 'sawtooth', .018),
  hit:   () => beep(320, 120, .08, 'triangle', .07),
  hurt:  () => beep(200, 70, .18, 'sawtooth', .06),
  tag:   () => { beep(660, 660, .07, 'square', .05); beep(880, 880, .07, 'square', .05, .07); beep(1320, 1320, .12, 'square', .05, .14); },
  out:   () => { beep(400, 100, .5, 'sawtooth', .06); },
  reload:() => { beep(300, 500, .06, 'triangle', .05); beep(500, 800, .06, 'triangle', .05, .25); },
  click: () => beep(200, 150, .04, 'square', .03),
  tick:  () => beep(600, 600, .08, 'square', .04),
  go:    () => beep(900, 1400, .2, 'square', .05),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => beep(f, f, .15, 'square', .05, i * .12)),
  lose:  () => [392, 330, 262].forEach((f, i) => beep(f, f * .98, .2, 'triangle', .06, i * .16))
};

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const turnTo = (a, target, max) => { const d = angDiff(a, target); return a + Math.max(-max, Math.min(max, d)); };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function burst(x, y, col, n, spd = 160, life = .5, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(spd * .3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * .5, life), max: life, col, size: rand(size * .6, size * 1.3) });
  }
}
function floatText(x, y, text, col) { texts.push({ x, y, text, col, life: 1.2 }); }
function addFeed(text, col) { feed.unshift({ text, col, t: 4 }); if (feed.length > 5) feed.pop(); }

// ---------- Round setup ----------
function makeEntity(x, y) { return { x, y, r: 14, angle: 0, hp: 100, maxHp: 100, alive: true, fireCd: 0, ammo: CLIP, reloading: false, reloadT: 0, hitFlash: 0, deadT: 0 }; }
function startMatch() {
  S.round = 0; S.pWins = 0; S.bWins = 0; S.tags = 0; S.shots = 0; S.hits = 0; feed = [];
  hideOverlay(); startRound();
}
function startRound() {
  S.round++;
  const D = DIFF[S.diff];
  const sp = playerSpawns[Math.floor(Math.random() * playerSpawns.length)];
  const pc = center(sp.c, sp.r);
  player = makeEntity(pc.x, pc.y);
  player.isPlayer = true;
  bots = [];
  const options = reachable.filter(t => t.c >= 19).map(t => center(t.c, t.r)).filter(p => dist(p, player) > 650);
  for (let i = 0; i < D.bots; i++) {
    let p = null;
    for (let tries = 0; tries < 60 && !p; tries++) {
      const cand = options[Math.floor(Math.random() * options.length)];
      if (bots.every(b => dist(b, cand) > 90)) p = cand;
    }
    if (!p) p = options[i % options.length];
    const b = makeEntity(p.x, p.y);
    Object.assign(b, BOT_INFO[i], { hp: D.hp, maxHp: D.hp, ammo: 10, angle: Math.PI, state: 'patrol', path: [], seeT: 0,
      lastKnown: null, strafeDir: Math.random() < .5 ? 1 : -1, strafeT: 0, repathT: rand(0, .5), stuckT: 0, lx: p.x, ly: p.y, lookT: 0 });
    bots.push(b);
  }
  bullets = []; particles = []; texts = [];
  S.timer = ROUND_TIME; S.mode = 'countdown'; S.stateT = 3; S.lastTick = 4;
}

// ---------- Shooting / damage ----------
function shoot(e, team, spread, dmg) {
  const a = e.angle + rand(-spread, spread), spd = team === 'p' ? 1050 : 820;
  const tip = e.r + 10;
  let sx = e.x + Math.cos(e.angle) * tip, sy = e.y + Math.sin(e.angle) * tip;
  if (solidAt(sx, sy)) { sx = e.x; sy = e.y; }
  bullets.push({ x: sx, y: sy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, team, dmg, life: 1.4,
    col: team === 'p' ? '#3ec6ff' : (e.col || '#ff8a3d') });
  burst(sx, sy, team === 'p' ? '#bff0ff' : '#ffe0c2', 3, 90, .15, 2);
}
function damage(t, dmg, b) {
  if (!t.alive) return;
  t.hp -= dmg; t.hitFlash = .12;
  burst(b.x, b.y, b.col, 8, 180, .35, 3);
  if (t.isPlayer) { S.shake = Math.min(12, S.shake + 6); sfx.hurt(); }
  else {
    S.hits++; sfx.hit();
    t.lastKnown = { x: player.x, y: player.y };
    if (t.state !== 'attack') { t.state = 'hunt'; t.path = []; t.repathT = 0; t.lookT = .6; t.lookAng = Math.atan2(player.y - t.y, player.x - t.x); }
  }
  if (t.hp <= 0) {
    t.hp = 0; t.alive = false; t.deadT = 1;
    burst(t.x, t.y, t.isPlayer ? '#3ec6ff' : t.col, 34, 260, .9, 4);
    burst(t.x, t.y, '#ffffff', 14, 200, .6, 2.5);
    if (t.isPlayer) { sfx.out(); addFeed('A bot tagged you!', '#ff8a3d'); }
    else { S.tags++; sfx.tag(); floatText(t.x, t.y - 20, 'TAGGED!', '#b6ff3b'); addFeed('You tagged ' + t.name + '!', '#b6ff3b'); }
  }
}

// ---------- Update ----------
function stickVec(s) {
  if (!s) return { x: 0, y: 0, mag: 0 };
  const dx = s.x - s.ox, dy = s.y - s.oy, l = Math.hypot(dx, dy), max = 70;
  const m = Math.min(1, l / max);
  return l < 1 ? { x: 0, y: 0, mag: 0 } : { x: dx / l * m, y: dy / l * m, mag: m };
}
function updatePlayer(dt, canMove) {
  const p = player;
  if (!p.alive) return;
  // aim
  const aim = stickVec(touch.aim);
  if (touch.aim && aim.mag > .15) p.angle = Math.atan2(aim.y, aim.x);
  else if (!usingTouch) p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  if (!canMove) return;
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  const l = Math.hypot(mx, my);
  if (l) { mx /= l; my /= l; }
  const mv = stickVec(touch.move);
  if (mv.mag > .1) { mx = mv.x; my = mv.y; }
  moveEntity(p, mx * P_SPEED * dt, my * P_SPEED * dt);
  // weapon
  p.fireCd -= dt;
  if (p.reloading) { p.reloadT -= dt; if (p.reloadT <= 0) { p.reloading = false; p.ammo = CLIP; } }
  const firing = mouse.down || (touch.aim && aim.mag > .4);
  if (firing && p.fireCd <= 0 && !p.reloading) {
    if (p.ammo > 0) {
      shoot(p, 'p', .035, P_DMG); p.ammo--; p.fireCd = P_FIRE; S.shots++; sfx.pShot();
      // bots hear shots nearby
      for (const b of bots) if (b.alive && b.state !== 'attack' && dist(b, p) < 480) {
        b.lastKnown = { x: p.x, y: p.y }; b.state = 'hunt'; b.path = []; b.repathT = 0;
      }
    } else startReload(p);
  }
  if (p.ammo === 0 && !p.reloading) startReload(p);
}
function startReload(e) { if (e.reloading || e.ammo === CLIP) return; e.reloading = true; e.reloadT = e.isPlayer ? RELOAD : 2; if (e.isPlayer) sfx.reload(); }

function followPath(b, spd, dt) {
  // smoothing: skip a node if the one after is directly reachable
  while (b.path.length > 1 && losWide(b, b.path[1], b.r - 2)) b.path.shift();
  if (!b.path.length) return false;
  const n = b.path[0], dx = n.x - b.x, dy = n.y - b.y, d = Math.hypot(dx, dy);
  if (d < 6) { b.path.shift(); return true; }
  const s = Math.min(spd * dt, d);
  moveEntity(b, dx / d * s, dy / d * s);
  b.moveAng = Math.atan2(dy, dx);
  return true;
}
function updateBot(b, dt) {
  const D = DIFF[S.diff], p = player;
  b.fireCd -= dt; b.repathT -= dt;
  if (b.reloading) { b.reloadT -= dt; if (b.reloadT <= 0) { b.reloading = false; b.ammo = 10; } }
  const d = dist(b, p);
  const toP = Math.atan2(p.y - b.y, p.x - b.x);
  const inView = Math.abs(angDiff(b.angle, toP)) < 1.25 || d < 130;
  const sees = p.alive && d < 700 && inView && los(b.x, b.y, p.x, p.y);
  if (sees) {
    b.seeT += dt; b.state = 'attack'; b.lastKnown = { x: p.x, y: p.y }; b.path = [];
    b.angle = turnTo(b.angle, toP, D.turn * dt);
    // movement: strafe + keep distance
    b.strafeT -= dt;
    if (b.strafeT <= 0) { b.strafeT = rand(.5, 1.3); if (Math.random() < .5) b.strafeDir *= -1; }
    let mx = Math.cos(toP + Math.PI / 2) * b.strafeDir, my = Math.sin(toP + Math.PI / 2) * b.strafeDir;

  const d = e.target.closest('[data-diff]');
  if (d) { S.diff = d.dataset.diff; sfx.click(); overlay.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('on', b === d)); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  sfx.click();
  if (a.dataset.act === 'play') startMatch();
  else if (a.dataset.act === 'resume') { hideOverlay(); S.mode = S.prevMode; }
  else if (a.dataset.act === 'menu') { player = null; bots = []; bullets = []; showMenu(); }
});

// ---------- Input ----------
function toCanvas(cx, cy) { const r = canvas.getBoundingClientRect(); return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height }; }
const inGame = () => S.mode === 'playing' || S.mode === 'countdown' || S.mode === 'roundEnd';
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR' && player && S.mode === 'playing') startReload(player);
  if (e.code === 'KeyM') muted = !muted;
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
    if (inGame()) showPause();
    else if (S.mode === 'paused') { hideOverlay(); S.mode = S.prevMode; }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (inGame()) showPause(); });
canvas.addEventListener('mousemove', e => { usingTouch = false; Object.assign(mouse, toCanvas(e.clientX, e.clientY)); mouse.inside = true; });
canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) { initAudio(); mouse.down = true; } });
addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function onTouch(e) {
  e.preventDefault(); usingTouch = true; initAudio();
  for (const t of e.changedTouches) {
    const p = toCanvas(t.clientX, t.clientY);
    if (e.type === 'touchstart') {
      if (p.x < W / 2 && !touch.move) touch.move = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
      else if (p.x >= W / 2 && !touch.aim) touch.aim = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
    } else if (e.type === 'touchmove') {
      for (const s of [touch.move, touch.aim]) if (s && s.id === t.identifier) { s.x = p.x; s.y = p.y; }
    } else {
      if (touch.move && touch.move.id === t.identifier) touch.move = null;
      if (touch.aim && touch.aim.id === t.identifier) touch.aim = null;
    }
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(t => canvas.addEventListener(t, onTouch, { passive: false }));

// ---------- Layout & loop ----------
function resize() {
  const aw = innerWidth - 20, ah = innerHeight - 52 - 20;
  const s = Math.max(.2, Math.min(aw / W, ah / H));
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  scale = canvas.width / W;
}
addEventListener('resize', resize);
resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
window.__arena = { S, get player() { return player; }, get bots() { return bots; }, startMatch, update };
})();
</script>
